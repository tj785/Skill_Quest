# Render.com Blueprint (free): New > Blueprint > pick this repository.
# Creates the Character Quest web service on Render's free plan.
# The database is a free PostgreSQL database from neon.tech (it doesn't expire):
# paste its connection string when Render asks for DATABASE_URL.
services:
  - type: web
    name: character-quest
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TEACHER_SIGNUP_CODE
        sync: false
